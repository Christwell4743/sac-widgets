<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background-color:#003B71;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.3);
    height:100%; padding:18px 32px;
    display:flex; flex-direction:column;
    justify-content:center; gap:7px;
    font-family:'72 Brand','72',Arial,sans-serif;
    overflow:hidden;
  }
  .badge {
    font-size:12px; font-weight:700;
    letter-spacing:2px; text-transform:uppercase;
    color:#89D1FF;
  }
  .title {
    font-size:26px; font-weight:700; color:#FFFFFF;
    font-family:'72 Brand Medium','72',Arial,sans-serif;
  }
  .sub {
    font-size:14px; color:rgba(255,255,255,0.65);
  }
</style>
</head>
<body>
  <div class="badge">Invoice Capture &middot; MoM Quality Dashboard</div>
  <div class="title">Month-over-Month Deep Comparison</div>
  <div class="sub">Select a month below to compare performance against the previous month</div>
</body>
</html>
