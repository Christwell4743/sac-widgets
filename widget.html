<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IC Quality Dashboard — Executive View</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<style>
@font-face{font-family:"72";src:url("https://ui5.sap.com/resources/sap/ui/core/themes/base/fonts/72-Regular.woff2") format("woff2");font-weight:400;}
@font-face{font-family:"72";src:url("https://ui5.sap.com/resources/sap/ui/core/themes/base/fonts/72-Bold.woff2") format("woff2");font-weight:700;}
@font-face{font-family:"72";src:url("https://ui5.sap.com/resources/sap/ui/core/themes/base/fonts/72-Light.woff2") format("woff2");font-weight:300;}
@font-face{font-family:"72 Brand";src:url("https://ui5.sap.com/resources/sap/ui/core/themes/base/fonts/72-Regular.woff2") format("woff2");font-weight:400;}
@font-face{font-family:"72 Brand";src:url("https://ui5.sap.com/resources/sap/ui/core/themes/base/fonts/72-Bold.woff2") format("woff2");font-weight:700;}
:root{
  --sap-blue:#1B90FF;--sap-hyperlink:#0070F2;--sap-navy:#002A86;--sap-deepnavy:#00144A;
  --sap-lightblue:#89D1FF;--sap-lightsky:#D1EFFF;--sap-shell:#354A5E;
  --sap-white:#FFFFFF;--sap-black:#000000;
  --sap-gray-dark:#666666;--sap-gray-mid:#999999;--sap-gray-light:#EAECEE;
  --rag-blue:#0070F2;--rag-green:#188918;--rag-amber:#C35500;--rag-red:#D20A0A;
  --rag-blue-bg:#E8F3FF;--rag-green-bg:#E6F4E6;--rag-amber-bg:#FFF2E6;--rag-red-bg:#FFEAEA;
  --dv1:#5899DA;--dv2:#E8743B;--dv3:#19A979;--dv4:#ED4A7B;--dv5:#945ECF;--dv6:#13A4B4;--dv7:#F0AB00;--dv8:#6C8893;
  --bg:#F5F6F7;--surface:#FFFFFF;--border:#D9D9D9;--border2:#E8EAED;
  --ink:#1D2D3E;--ink2:#6A6D70;--ink3:#8D9195;--rad:8px;
  font-family:"72","72 Brand",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:14px;line-height:1.5;
}
*{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}body{background:var(--bg);color:var(--ink);}
.shell{position:sticky;top:0;z-index:300;background:var(--sap-shell);height:44px;display:flex;align-items:center;padding:0 1.25rem;gap:.65rem;box-shadow:0 2px 8px rgba(0,0,0,.18);}
.sap-sq{background:#fff;color:var(--sap-shell);font-weight:700;font-size:11px;padding:2px 6px;border-radius:2px;letter-spacing:.5px;flex-shrink:0;}
.shell-pipe{color:rgba(255,255,255,.2);font-size:18px;font-weight:100;}
.shell-app{color:rgba(255,255,255,.88);font-size:13px;font-weight:700;}
.shell-sub{color:rgba(255,255,255,.45);font-size:12px;}
.shell-sp{flex:1;}
.shell-date{color:rgba(255,255,255,.45);font-size:12px;}
.live-chip{display:inline-flex;align-items:center;gap:.3rem;background:rgba(255,255,255,.1);padding:.18rem .5rem;border-radius:10px;font-size:11px;color:rgba(255,255,255,.75);}
.live-dot{width:8px;height:8px;border-radius:50%;background:#188918;display:inline-block;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--dv7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.titlebar{background:var(--sap-navy);padding:.85rem 1.5rem;display:flex;align-items:center;gap:1.25rem;}
.tb-left{flex:1;}
.tb-left h1{color:#fff;font-size:1.05rem;font-weight:700;margin-bottom:.1rem;}
.tb-sub{color:rgba(255,255,255,.45);font-size:12px;}
.tb-right{text-align:right;flex-shrink:0;}
.tb-view-badge{display:inline-flex;align-items:center;gap:.3rem;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:.25rem .65rem;border-radius:4px;font-size:12px;font-weight:700;color:#fff;}
.tb-view-dot{width:7px;height:7px;border-radius:2px;background:var(--rag-blue);}
.data-stamp{color:rgba(255,255,255,.5);font-size:12px;margin-top:.25rem;}
.ragbar{background:#fff;border-bottom:2px solid var(--border2);padding:.42rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
.rag-lbl{font-size:11px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0;}
.rag-scale{display:flex;gap:.65rem;flex-wrap:wrap;align-items:center;}
.rag-pill{display:inline-flex;align-items:center;gap:.28rem;font-size:12px;font-weight:600;padding:.15rem .5rem;border-radius:3px;}
.rp-b{background:var(--rag-blue-bg);color:var(--rag-blue);}
.rp-g{background:var(--rag-green-bg);color:var(--rag-green);}
.rp-a{background:var(--rag-amber-bg);color:var(--rag-amber);}
.rp-r{background:var(--rag-red-bg);color:var(--rag-red);}
.rag-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.rag-sp{flex:1;}
.fbar{background:#fff;border-bottom:1px solid var(--border2);padding:.45rem 1.5rem;display:flex;align-items:center;flex-wrap:wrap;gap:.45rem;position:sticky;top:44px;z-index:199;}
.sl{font-size:11px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;flex-shrink:0;}
.fsel{border:1px solid var(--border);background:#fff;color:var(--ink);padding:.2rem .45rem;border-radius:4px;font-size:12px;font-family:inherit;cursor:pointer;min-width:130px;}
.fsel:focus{outline:2px solid var(--sap-hyperlink);outline-offset:1px;}
.fdiv{color:var(--border2);font-size:16px;margin:0 .1rem;}
.fsp{flex:1;}
.fcast-note{display:none;align-items:center;gap:.25rem;background:#F3E8FF;color:#5D36FF;padding:.18rem .5rem;border-radius:4px;font-size:11px;font-weight:600;}
.fcast-note.show{display:inline-flex;}
.filter-info{font-size:11px;color:var(--ink2);background:var(--bg);padding:.18rem .45rem;border-radius:4px;white-space:nowrap;}
.dq-bar{background:#FFFBF0;border-bottom:1px solid #F0D070;padding:.32rem 1.5rem;display:flex;flex-wrap:wrap;gap:.55rem;align-items:center;}
.dq-item{display:flex;align-items:center;gap:.28rem;font-size:11px;color:var(--ink2);}
.dq-lbl{font-weight:700;color:var(--ink);white-space:nowrap;}
.dq-badge{display:inline-flex;padding:.08rem .35rem;border-radius:3px;font-size:10px;font-weight:700;}
.dq-badge.partial{background:var(--rag-amber-bg);color:var(--rag-amber);}
.dq-badge.complete{background:var(--rag-blue-bg);color:var(--rag-blue);}
.dq-div{color:var(--border2);font-size:14px;}
.main{padding:1rem 1.5rem;max-width:1600px;margin:0 auto;}
.hero{background:linear-gradient(135deg,var(--sap-deepnavy) 0%,var(--sap-navy) 55%,#003DB0 100%);border-radius:var(--rad);padding:1.15rem 1.5rem;margin-bottom:1rem;color:#fff;position:relative;overflow:hidden;}
.hero::before{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.03);}
.hero-eye{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.5);margin-bottom:.25rem;}
.hero-h{font-size:1.5rem;font-weight:700;color:#fff;line-height:1.2;margin-bottom:.2rem;}
.hero-s{font-size:12px;color:rgba(255,255,255,.55);}
.hero-stats{display:flex;gap:1.5rem;margin-top:.9rem;flex-wrap:wrap;}
.hs{border-left:2px solid rgba(255,255,255,.18);padding-left:.8rem;}
.hs-v{font-size:1.2rem;font-weight:700;color:#fff;}
.hs-l{font-size:11px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.3px;}
.hero-rag{display:inline-flex;align-items:center;gap:.35rem;margin-top:.6rem;padding:.28rem .65rem;border-radius:4px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);}
.hrd{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.krow{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem;margin-bottom:1rem;}
.kc{background:var(--surface);border:1px solid var(--border2);border-radius:var(--rad);padding:.82rem 1rem;position:relative;overflow:hidden;transition:box-shadow .14s;}
.kc:hover{box-shadow:0 3px 14px rgba(0,0,0,.09);}
.kc::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--border);}
.kc.rb::before{background:var(--rag-blue);}.kc.rg::before{background:var(--rag-green);}
.kc.ra::before{background:var(--rag-amber);}.kc.rr::before{background:var(--rag-red);}
.kl{font-size:12px;color:var(--ink2);margin-bottom:.28rem;font-weight:600;}
.kv{font-size:1.28rem;font-weight:700;color:var(--ink);}
.kv.rb{color:var(--rag-blue)!important;}.kv.rg{color:var(--rag-green)!important;}
.kv.ra{color:var(--rag-amber)!important;}.kv.rr{color:var(--rag-red)!important;}
.ks{font-size:12px;color:var(--ink3);margin-top:.18rem;}
.kdelta{display:inline-flex;align-items:center;gap:.18rem;font-size:12px;font-weight:700;margin-top:.28rem;}
.kdelta.up{color:var(--rag-green);}.kdelta.dn{color:var(--rag-red);}.kdelta.nt{color:var(--ink3);}
.kbadge{display:inline-flex;align-items:center;padding:.1rem .38rem;border-radius:3px;font-size:11px;font-weight:700;margin-top:.28rem;}
.kbadge.rb{background:var(--rag-blue-bg);color:var(--rag-blue);}
.kbadge.rg{background:var(--rag-green-bg);color:var(--rag-green);}
.kbadge.ra{background:var(--rag-amber-bg);color:var(--rag-amber);}
.kbadge.rr{background:var(--rag-red-bg);color:var(--rag-red);}
.card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--rad);padding:1rem;margin-bottom:1rem;transition:box-shadow .14s;}
.card:hover{box-shadow:0 2px 12px rgba(0,0,0,.07);}
.card-h{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:.72rem;display:flex;align-items:center;gap:.45rem;}
.card-sub{font-size:12px;color:var(--ink2);font-weight:400;}
.card-note{font-size:12px;color:var(--ink3);margin-top:.5rem;font-style:italic;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;}
.g23{display:grid;grid-template-columns:2fr 1fr;gap:1rem;margin-bottom:1rem;}
.ch-wrap{position:relative;width:100%;}.ch-wrap canvas{display:block;width:100%!important;}
.ipanel{background:linear-gradient(135deg,#000D1A 0%,var(--sap-deepnavy) 40%,var(--sap-navy) 100%);border-radius:var(--rad);padding:1rem 1.2rem;margin-bottom:1rem;}
.ip-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;}
.ip-badge{display:inline-flex;align-items:center;gap:.3rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);padding:.18rem .55rem;border-radius:12px;font-size:11px;font-weight:700;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:.5px;}
.ip-dot{width:6px;height:6px;border-radius:50%;background:var(--sap-blue);}
.ip-per{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:.55rem;}
.ins-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;}
.ins{background:rgba(255,255,255,.07);border-radius:6px;padding:.75rem .9rem;border-left:3px solid var(--rag-blue);transition:background .15s;}
.ins:hover{background:rgba(255,255,255,.11);}
.ins.warn{border-left-color:var(--dv7);}.ins.crit{border-left-color:var(--rag-red);}
.ins.pos{border-left-color:var(--rag-green);}.ins.info{border-left-color:var(--sap-lightblue);}
.ins.amber{border-left-color:var(--rag-amber);}
.ins-t{font-size:12px;font-weight:700;color:rgba(255,255,255,.92);margin-bottom:.22rem;display:flex;align-items:flex-start;gap:.3rem;line-height:1.35;}
.ins-b{font-size:12px;color:rgba(255,255,255,.58);line-height:1.5;}
.ins-b strong{color:rgba(255,255,255,.85);}
.ins-tag{display:inline-flex;padding:.05rem .32rem;border-radius:3px;font-size:10px;font-weight:700;background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);margin-left:.25rem;}
.narrative{font-size:13px;line-height:1.8;color:var(--ink);}
.narrative p{margin-bottom:.55rem;padding:.45rem .75rem;border-left:3px solid var(--sap-hyperlink);background:var(--rag-blue-bg);border-radius:0 4px 4px 0;}
.narrative p:last-child{margin-bottom:0;}
.narrative strong{color:var(--sap-navy);}
.srow{display:flex;align-items:center;gap:.55rem;padding:.32rem 0;border-bottom:1px solid var(--border2);}
.srow:last-child{border-bottom:none;}
.sc-code{font-size:12px;font-weight:700;color:var(--ink);width:34px;flex-shrink:0;}
.sc-name{font-size:12px;color:var(--ink2);width:64px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sc-track{flex:1;background:var(--bg);border-radius:4px;height:14px;overflow:hidden;min-width:60px;}
.sc-fill{height:100%;border-radius:4px;transition:width .5s ease;}
.sc-pct{font-size:12px;font-weight:700;width:52px;text-align:right;flex-shrink:0;}
.sc-badge{padding:.08rem .32rem;border-radius:3px;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.sc-badge.rb{background:var(--rag-blue);}.sc-badge.rg{background:var(--rag-green);}
.sc-badge.ra{background:var(--rag-amber);}.sc-badge.rr{background:var(--rag-red);}
.fcbanner{background:linear-gradient(135deg,#1a0d3a,#5D36FF);border-radius:var(--rad);padding:.88rem 1.2rem;margin-bottom:1rem;display:flex;align-items:center;gap:1.2rem;}
.fc-val{font-size:1.5rem;font-weight:700;color:#fff;flex-shrink:0;}
.fc-narr{font-size:12px;color:rgba(255,255,255,.68);line-height:1.5;flex:1;}
.fc-eye{font-size:11px;opacity:.55;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.12rem;color:#fff;}
.rec-list{display:flex;flex-direction:column;gap:.55rem;}
.rec-item{background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:.72rem 1rem;display:flex;gap:.7rem;align-items:flex-start;}
.rec-num{width:22px;height:22px;border-radius:50%;background:var(--sap-hyperlink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px;}
.rec-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:.18rem;}
.rec-body{font-size:12px;color:var(--ink2);line-height:1.45;}
.rec-tags{margin-top:.32rem;display:flex;flex-wrap:wrap;gap:.22rem;}
.rtag{display:inline-flex;padding:.08rem .38rem;border-radius:3px;font-size:11px;font-weight:600;}
.rtag.blue{background:var(--rag-blue-bg);color:var(--rag-blue);}
.rtag.amber{background:var(--rag-amber-bg);color:var(--rag-amber);}
.rtag.green{background:var(--rag-green-bg);color:var(--rag-green);}
.rtag.red{background:var(--rag-red-bg);color:var(--rag-red);}
.rtag.navy{background:var(--sap-lightsky);color:var(--sap-navy);}
.exc-banner{background:var(--rag-amber-bg);border:1px solid var(--rag-amber);border-radius:var(--rad);padding:.72rem 1rem;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;font-size:13px;font-weight:700;color:var(--rag-amber);}
.risk-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1rem;}
.risk-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--rad);padding:.82rem 1rem;border-left:4px solid var(--rag-red);}
.risk-card.warn{border-left-color:var(--rag-amber);}.risk-card.info{border-left-color:var(--sap-lightblue);}
.risk-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:.18rem;}
.risk-body{font-size:12px;color:var(--ink2);line-height:1.45;}
.stbl{width:100%;border-collapse:collapse;font-size:13px;}
.stbl thead th{background:var(--bg);color:var(--ink2);text-transform:uppercase;font-size:11px;letter-spacing:.45px;padding:.48rem .72rem;text-align:left;border-bottom:2px solid var(--border);font-weight:700;white-space:nowrap;}
.stbl tbody td{padding:.48rem .72rem;border-bottom:1px solid var(--border2);font-size:12px;}
.stbl tbody tr:last-child td{border-bottom:none;}
.stbl tbody tr:hover td{background:#F8F9FB;}
.stbl .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
.stbl .center{text-align:center;}
.hcell{display:inline-block;padding:.18rem .38rem;border-radius:3px;font-size:12px;font-weight:600;min-width:54px;text-align:center;}
.hcell.rb{background:var(--rag-blue-bg);color:var(--rag-blue);}
.hcell.rg{background:var(--rag-green-bg);color:var(--rag-green);}
.hcell.ra{background:var(--rag-amber-bg);color:var(--rag-amber);}
.hcell.rr{background:var(--rag-red-bg);color:var(--rag-red);}
.hcell.na{background:var(--bg);color:var(--ink3);}
.tag{display:inline-flex;padding:.1rem .4rem;border-radius:3px;font-size:12px;font-weight:700;}
.tag.blue{background:var(--rag-blue-bg);color:var(--rag-blue);}
.tag.navy{background:var(--sap-lightsky);color:var(--sap-navy);}
.tag.green{background:var(--rag-green-bg);color:var(--rag-green);}
.tag.amber{background:var(--rag-amber-bg);color:var(--rag-amber);}
.tag.purple{background:#F0E8FF;color:#5D36FF;}
.sec-h{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:.55rem;text-transform:uppercase;letter-spacing:.45px;display:flex;align-items:center;gap:.4rem;}
abbr{cursor:help;border-bottom:1px dashed var(--ink3);text-decoration:none;}
.divider{border:none;border-top:1px solid var(--border2);margin:.65rem 0;}
.section-div{border:none;border-top:2px solid var(--border2);margin:1rem 0;opacity:.5;}
.metric-toggle-btn{display:inline-flex;align-items:center;gap:.35rem;background:#fff;border:1px solid var(--border);border-radius:4px;padding:.22rem .65rem;font-size:12px;font-weight:600;color:var(--sap-hyperlink);cursor:pointer;font-family:inherit;transition:all .12s;}
.metric-toggle-btn:hover{background:var(--rag-blue-bg);border-color:var(--sap-hyperlink);}
.metric-panel{display:none;background:var(--surface);border:1px solid var(--border2);border-radius:var(--rad);padding:1.1rem 1.4rem;margin:.5rem 0 1rem;box-shadow:0 3px 12px rgba(0,0,0,.09);}
.metric-panel.show{display:block;}
.metric-panel-h{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:.9rem;display:flex;align-items:center;gap:.4rem;padding-bottom:.6rem;border-bottom:2px solid var(--border2);}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;}
.metric-def{background:#FFFFFF;border-radius:7px;padding:.75rem .9rem;border-left:4px solid var(--sap-hyperlink);box-shadow:0 1px 4px rgba(0,0,0,.07);}
.metric-def.amber{border-left-color:var(--rag-amber);background:var(--rag-amber-bg);}
.metric-def.red{border-left-color:var(--rag-red);background:var(--rag-red-bg);}
.metric-def.green{border-left-color:var(--rag-green);background:var(--rag-green-bg);}
.mdef-name{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:.3rem;}
.mdef-body{font-size:12px;color:var(--ink2);line-height:1.5;font-style:italic;}
.mdef-scale{font-size:11px;color:var(--ink3);margin-top:.3rem;padding-top:.3rem;border-top:1px solid var(--border2);}
footer{background:var(--sap-navy);color:rgba(255,255,255,.32);padding:.9rem 1.5rem;font-size:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin-top:1.5rem;}
footer strong{color:rgba(255,255,255,.55);}
@media(max-width:1100px){.krow{grid-template-columns:repeat(3,1fr);}.metric-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:800px){.g2,.g23{grid-template-columns:1fr;}.ins-grid{grid-template-columns:1fr;}.krow{grid-template-columns:repeat(2,1fr);}.hero-stats{gap:1rem;}.risk-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<script>
// ── SAP Fiori Chart Defaults ──
Chart.defaults.font.family = '"72","72 Brand",system-ui,Arial,sans-serif';
Chart.defaults.font.size = 12;
Chart.defaults.color = '#6A6D70';
Chart.defaults.plugins.legend.labels.usePointStyle = true;
Chart.defaults.plugins.legend.labels.boxWidth = 8;
Chart.defaults.plugins.legend.labels.padding = 14;
Chart.defaults.plugins.tooltip.padding = 10;
Chart.defaults.plugins.tooltip.titleFont = { size: 12, weight: '700' };
Chart.defaults.plugins.tooltip.bodyFont  = { size: 12 };
Chart.defaults.scale.grid.color = 'rgba(0,0,0,.05)';
Chart.defaults.scale.ticks.maxRotation = 0;

// ── SAP Brand & RAG Colors ──

// ── RAG Utilities ──
function ragCls(v){ return v>=97?'rb': v>=95?'rg': v>=90?'ra':'rr'; }
function ragCol(v){ return v>=97?RB: v>=95?RG: v>=90?RA:RR; }
function ragBg(v){  return v>=97?'#E8F3FF': v>=95?'#E6F4E6': v>=90?'#FFF2E6':'#FFEAEA'; }
function ragLbl(v){ return v>=97?'Exceeds Target ≥97%': v>=95?'On Target 95–97%': v>=90?'Needs Attention 90–95%':'Below Target <90%'; }
function ragBadge(v,txt){ return '<span class="kbadge '+ragCls(v)+'">'+(txt||ragLbl(v))+'</span>'; }
function fmt(v,d=2){ return v==null?'—':v.toFixed(d)+'%'; }
function fmtN(v){ return v==null?'—':v.toLocaleString(); }

// ── Resolve period data ──
function getPDS(){
  const p=state.period, r=state.region;
  const base=PD_STORE[p]||PD_STORE.sep;
  if(r!=='all'&&REGION_STORE[p]&&REGION_STORE[p][r]){
    const rila=REGION_STORE[p][r];
    return {...base, ila:rila, label:base.label+' · '+r.toUpperCase()};
  }
  return base;
}

function getPD(){
  const p=state.period, r=state.region;
  if(FCST_PERIODS.includes(p)){
    const f=PD_STORE[p];
    return {...f, isForecast:true};
  }
  let idxs;
  if(p in periodIdx) idxs=[periodIdx[p]];
  else if(p in qtrRange) idxs=qtrRange[p];
  else idxs=qtrRange.ytd;
  let ilaArr=r==='all'?D_ILA:(D_ILA_R[r]||D_ILA);
  const ilaVals=idxs.map(i=>ilaArr[i]).filter(x=>x!=null);
  const ila=ilaVals.reduce((a,b)=>a+b,0)/ilaVals.length;
  const prevIla=idxs[0]>0?(r==='all'?D_ILA:ilaArr)[idxs[0]-1]:null;
  const momDelta=prevIla!=null?(ila-prevIla).toFixed(2):null;
  const rev=idxs.reduce((a,i)=>a+(D_REV[i]||0),0);
  const inv=idxs.reduce((a,i)=>a+(D_INV[i]||0),0);
  const escal=idxs.reduce((a,i)=>a+(D_ESCAL[i]||0),0);
  const concurE=idxs.reduce((a,i)=>a+(D_CONCUR[i]||0),0);
  const concurPct=escal>0?(concurE/escal*100):0;
  const mark=idxs.reduce((a,i)=>a+(D_MARK[i]||0),0);
  const revPct=idxs.map(i=>D_REVPCT[i]).reduce((a,b)=>a+b,0)/idxs.length;
  let label;
  if(idxs.length===1) label=MONTHS_LG[idxs[0]]+' 2026';
  else if(p==='q1') label='Q1 2026 (Jan–Mar)';
  else if(p==='q2') label='Q2 2026 (Apr–Jun)';
  else if(p==='q3') label='Q3 2026 (Jul–Sep)';
  else label='YTD 2026 (Jan–Sep)';
  const cfBase=(rev+escal);
  const cfIla=cfBase>0?((cfBase-(mark+concurE))/cfBase*100):ila;
  return{ila,prevIla,momDelta,rev,inv,escal,concurE,concurPct,mark,revPct,label,idxs,isForecast:false,cfIla};
}

// ── Chart Registry ──
const CH={};
function mkChart(id,cfg){
  const el=document.getElementById(id);if(!el)return;
  if(CH[id])CH[id].destroy();
  CH[id]=new Chart(el,cfg);
  return CH[id];
}
function updChart(id,datasets,labels){
  const c=CH[id];if(!c)return;
  if(labels)c.data.labels=labels;
  datasets.forEach((ds,i)=>{if(c.data.datasets[i])Object.assign(c.data.datasets[i],ds);});
  c.update('none');
}

// ── Site Scorecard ──
function buildSiteScorecard(period){
  const el=document.getElementById('site-scorecard');if(!el)return;
  const sites=(SITE_STORE[period]||SITE_STORE.sep);
  const filtered=state.site==='all'?sites:sites.filter(s=>s.code.toLowerCase()===state.site);
  el.innerHTML='';
  filtered.forEach(s=>{
    const cls=ragCls(s.extILA), col=ragCol(s.extILA);
    const row=document.createElement('div');
    row.className='srow';
    row.innerHTML=
      '<span class="sc-code">'+s.code+'</span>'+
      '<span class="sc-name" title="'+s.code+(s.anomaly?' *Anomaly':'')+'">'+s.code+(s.anomaly?' *':'')+'</span>'+
      '<div class="sc-track"><div class="sc-fill" style="width:'+Math.max(s.extILA,5)+'%;background:'+col+';"></div></div>'+
      '<span class="sc-pct" style="color:'+col+'">'+s.extILA.toFixed(2)+'%</span>'+
      '<span class="sc-badge '+cls+'">'+ragLbl(s.extILA).split(' ')[0]+'</span>';
    el.appendChild(row);
  });
}

// ── Smart Insights Narrative ──
function genNarrative(pd){
  const ins=[];
  const ila=pd.ila, isFc=pd.isForecast;

  // Insight 1: ILA Status
  ins.push({
    cls: ila>=97?'pos':ila>=95?'info':ila>=90?'warn':'crit',
    tag: ila>=97?'Exceeds Target':ila>=95?'On Target':ila>=90?'Needs Attention':'Below Target',
    t:   'Quality ILA: '+fmt(ila),
    b:   'Quality ILA at <strong>'+fmt(ila)+'</strong> — '+ragLbl(ila)+'. Service target: ≥95.00%. '+
         (pd.momDelta!=null?('Prior period variance: '+(parseFloat(pd.momDelta)>=0?'+':'')+pd.momDelta+'pp.'):'')
  });

  // Insight 2: Combined Accuracy / Escalations
  if(!isFc && pd.escal!=null){
    const concHigh=pd.concurPct>65;
    ins.push({
      cls: concHigh?'crit':'warn',
      tag: concHigh?'Elevated':'Acceptable',
      t:   'SAP Concur Error Rate: '+fmt(pd.concurPct,1),
      b:   '<strong>'+fmtN(pd.concurE)+'</strong> of <strong>'+fmtN(pd.escal)+'</strong> escalations tagged SAP Concur Error ('+fmt(pd.concurPct,1)+'). '+
           (concHigh?'Elevated — Operations Team root cause analysis recommended.':'Within acceptable range.')
    });
  } else if(isFc){
    ins.push({
      cls:'info', tag:'Projection',
      t:  'Forecast Period — '+pd.label,
      b:  'AI projection: <strong>'+fmt(pd.ila)+'</strong> ILA. 90% CI: '+fmt(pd.ila-0.5)+'–'+fmt(pd.ila+0.43)+'. Based on Jan–Sep 2026 trajectory.'
    });
  }

  // Insight 3: Review Coverage
  if(!isFc && pd.revPct!=null){
    const covGood=pd.revPct>=3, covOk=pd.revPct>=1;
    ins.push({
      cls: covGood?'pos':covOk?'warn':'crit',
      tag: covGood?'On Target':covOk?'Below Target':'Critical',
      t:   'Review Coverage: '+pd.revPct.toFixed(2)+'%',
      b:   '<strong>'+fmtN(pd.rev)+'</strong> reviews on <strong>'+(pd.inv?(pd.inv/1e6).toFixed(2)+'M':'—')+'</strong> invoices. '+
           (covGood?'Coverage meets 3% policy target.':covOk?'Coverage below 3% policy target. Gap: '+(3-pd.revPct).toFixed(2)+'pp.':'Coverage critically low — investigate capacity.')
    });
  }

  // Insight 4: Regional Alert
  const reg=REGION_STORE[state.period]||REGION_STORE.sep;
  if(reg && state.region==='all' && !isFc){
    const minReg=Object.entries(reg).sort((a,b)=>a[1]-b[1])[0];
    const regNames={apac:'APAC',emea:'EMEA',latam:'LATAM',na:'North America'};
    ins.push({
      cls: minReg[1]>=97?'pos':minReg[1]>=95?'info':minReg[1]>=90?'warn':'crit',
      tag: 'Regional',
      t:   'Lowest Region: '+regNames[minReg[0]]+' at '+fmt(minReg[1]),
      b:   regNames[minReg[0]]+' at <strong>'+fmt(minReg[1])+'</strong> — '+ragLbl(minReg[1])+'. '+
           (minReg[1]<95?'Proactive QBR scheduling recommended for accounts in at-risk band.':'Regional performance within acceptable range.')
    });
  } else if(state.region!=='all' && !isFc){
    ins.push({
      cls:'info', tag:'Region Filter',
      t:  'Region: '+state.region.toUpperCase()+' — '+fmt(ila),
      b:  'Showing data scoped to <strong>'+state.region.toUpperCase()+'</strong>. ILA: <strong>'+fmt(ila)+'</strong> — '+ragLbl(ila)+'.'
    });
  }

  // Insight 5: C95 Client Portfolio
  const pdFull=PD_STORE[state.period]||PD_STORE.sep;
  if(!isFc && pdFull.c95!=null){
    const below=pdFull.clients?Math.round(pdFull.clients*(1-pdFull.c95/100)):null;
    ins.push({
      cls: pdFull.c95>=90?'pos':pdFull.c95>=85?'info':'warn',
      tag: 'Client Portfolio',
      t:   'Clients ≥95% ILA: '+fmt(pdFull.c95,1),
      b:   '<strong>'+fmtN(Math.round((pdFull.c95/100)*(pdFull.clients||2171)))+'</strong> of <strong>'+fmtN(pdFull.clients||2171)+'</strong> clients meet the ≥95% ILA threshold.'+
           (below?' <strong>'+fmtN(below)+'</strong> clients below SLA — proactive QBR recommended.':'')
    });
  }

  // Insight 6: YTD Forecast
  ins.push({
    cls:'info', tag:'Outlook',
    t:  'Q4 2026 Outlook — Stable',
    b:  'YTD ILA at <strong>98.04%</strong> heading into Q4. Statistical forecast: <strong>98.21%</strong> (range: 97.70–98.65%). Seasonal volume increase Oct–Nov may create temporary pressure.'
  });

  return ins.slice(0,6);
}

function renderInsights(pd){
  const grid=document.getElementById('exec-ins-grid');if(!grid)return;
  const ins=genNarrative(pd);
  // Determine grid columns: use 3-col for 6 insights (2 rows of 3)
  grid.style.gridTemplateColumns='repeat(3,1fr)';
  grid.innerHTML=ins.map(i=>
    '<div class="ins '+i.cls+'">'+
      '<div class="ins-t">'+
        (i.tag?'<span class="ins-tag">'+i.tag+'</span> ':'')+
        i.t+
      '</div>'+
      '<div class="ins-b">'+i.b+'</div>'+
    '</div>'
  ).join('');
}

function aggregateQualityRows(rows, periodKey) {
  if (!rows || !rows.length) return null;

  // Month filter map
  var monthMap = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9};
  var qtrMap   = {q1:[1,2,3], q2:[4,5,6], q3:[7,8,9]};

  function monthOf(dateStr) {
    if (!dateStr) return 0;
    return new Date(dateStr).getMonth() + 1; // 1-indexed
  }

  var filtered = rows.filter(function(r) {
    var mo = monthOf(r.DATE_REVIEWED || r.REVIEW_DATE);
    if (periodKey in monthMap) return mo === monthMap[periodKey];
    if (periodKey in qtrMap)   return qtrMap[periodKey].indexOf(mo) !== -1;
    return true; // ytd = all rows
  });

  // Apply site filter
  if (state.site !== 'all') {
    // Direct match — no aliases; LOCATION values are used as-is
    var locFilter = state.site.toUpperCase();
    filtered = filtered.filter(function(r){
      return (r.LOCATION || '').toUpperCase() === locFilter.toUpperCase();
    });
  }

  if (!filtered.length) return null;

  var totalILR = filtered.reduce(function(a,r){ return a + (parseFloat(r.INVOICE_LEVEL_RATING)||0); }, 0);
  var totalCnt = filtered.reduce(function(a,r){ return a + (parseFloat(r.COUNT)||0); }, 0);
  var ila = totalCnt > 0 ? (totalILR / totalCnt * 100) : null;

  return { ila: ila, reviews: totalCnt, rows: filtered };
}

/**
 * Aggregate escalation rows for a given period key.
 */
function aggregateEscalRows(rows, periodKey) {
  if (!rows || !rows.length) return null;
  var monthMap = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9};
  var qtrMap   = {q1:[1,2,3], q2:[4,5,6], q3:[7,8,9]};
  function monthOf(d){ return new Date(d).getMonth()+1; }

  var filtered = rows.filter(function(r){
    var mo = monthOf(r.DATE_REVIEWED);
    if (periodKey in monthMap) return mo === monthMap[periodKey];
    if (periodKey in qtrMap)   return qtrMap[periodKey].indexOf(mo) !== -1;
    return true;
  });

  if (state.site !== 'all') {
    var locFilter = state.site.toUpperCase();
    filtered = filtered.filter(function(r){
      return (r.LOCATION||'').toUpperCase() === locFilter.toUpperCase();
    });
  }

  if (!filtered.length) return null;

  var totalEscal   = filtered.reduce(function(a,r){ return a + (parseFloat(r.ESCALATION_COUNT)||0); }, 0);
  var totalConcur  = filtered.reduce(function(a,r){ return a + (parseFloat(r.IF_SCORE_SHOULD_CHANGE_1_0)||0); }, 0);
  var concurPct    = totalEscal > 0 ? (totalConcur / totalEscal * 100) : 0;

  return { escal: totalEscal, concurE: totalConcur, concurPct: concurPct };
}

// SAC CUSTOM WIDGET DATA BRIDGE
// Works with SAC Stories Custom Widget API (no Analytics Designer needed).
// Falls back gracefully to hardcoded sample data when not in SAC.
// ══════════════════════════════════════════════════════════════

// monthOf helper — shared scope (used in aggregateQualityRows, aggregateEscalRows, applyCWLiveData)
function monthOf(dateStr) {
  if (!dateStr) return 0;
  return new Date(dateStr).getMonth() + 1; // 1-indexed
}

/**
 * Parse a Custom Widget data binding into flat row objects.
 * Handles both array-of-arrays (with rawValue cells) and array-of-objects.
 * dimKeys + measKeys define the expected column names IN ORDER.
 */
function parseCWBinding(widget, bindingId, dimKeys, measKeys) {
  try {
    if (!widget || !widget.dataBindings) return null;
    var binding = widget.dataBindings.getDataBinding(bindingId);
    if (!binding) return null;
    var result = binding.data;
    if (!result) return null;

    // Determine column order from metadata (most reliable)
    var columns = [];
    var meta = result.metadata || result.feeds;
    if (meta && meta.feeds) {
      meta.feeds.forEach(function(feed) {
        if (feed.values) {
          feed.values.forEach(function(v) {
            columns.push(v.key || v.id || v.name || String(v));
          });
        }
      });
    }
    // Fallback: use provided keys in order
    if (!columns.length) columns = dimKeys.concat(measKeys);

    var rows = result.data || result;
    if (!Array.isArray(rows)) return null;
    if (!rows.length) return [];

    // Debug: log raw format once
    console.info('[CW Bridge] ' + bindingId + ' — ' + rows.length + ' rows, cols:', columns);

    return rows.map(function(row) {
      var obj = {};
      if (Array.isArray(row)) {
        columns.forEach(function(col, i) {
          var cell = row[i];
          obj[col] = (cell !== null && cell !== undefined &&
                      typeof cell === 'object' && 'rawValue' in cell)
            ? cell.rawValue : cell;
        });
      } else if (row && typeof row === 'object') {
        Object.keys(row).forEach(function(k) {
          var cell = row[k];
          obj[k] = (cell !== null && cell !== undefined &&
                    typeof cell === 'object' && 'rawValue' in cell)
            ? cell.rawValue : cell;
        });
      }
      return obj;
    });
  } catch(e) {
    console.error('[CW Bridge] parseCWBinding failed for', bindingId, ':', e);
    return null;
  }
}

/**
 * Main Custom Widget data applier.
 * Replaces applySACLiveData() — works with Custom Widget API instead of Script API.
 */
function applyCWLiveData(widget) {
  try {
    var qualRows    = parseCWBinding(widget, 'qualityData',
                        ['DATE_REVIEWED','LOCATION'], ['INVOICE_LEVEL_RATING','COUNT']);
    var escalRows   = parseCWBinding(widget, 'escalationData',
                        ['DATE_REVIEWED','LOCATION'], ['ESCALATION_COUNT','IF_SCORE_SHOULD_CHANGE_1_0']);
    var summaryRows = parseCWBinding(widget, 'summaryData',
                        ['REVIEW_DATE','LOCATION'], ['QS_REVIEW_COUNT','EDW_INVOICE_COUNT','REVIEW_RATE']);

    if (!qualRows && !escalRows && !summaryRows) {
      console.warn('[CW Bridge] No data received yet — retaining sample data.');
      return;
    }

    // Overlay live data into PD_STORE for each period
    var periods = ['jan','feb','mar','apr','may','jun','jul','aug','sep','q1','q2','q3','ytd'];
    periods.forEach(function(p) {
      var qd = aggregateQualityRows(qualRows, p);
      var ed = aggregateEscalRows(escalRows, p);
      if (qd && qd.ila != null) {
        PD_STORE[p].ila = qd.ila;
        PD_STORE[p].rev = qd.reviews;
      }
      if (ed) {
        PD_STORE[p].escal     = ed.escal;
        PD_STORE[p].concurE   = ed.concurE;
        PD_STORE[p].concurPct = ed.concurPct;
      }
    });

    // Override REVIEW_RATE from AM_IC_COMBINED_SUMMARY
    if (summaryRows && summaryRows.length) {
      var totalReviews = summaryRows.reduce(function(a,r){ return a+(parseFloat(r.QS_REVIEW_COUNT)||0); }, 0);
      var totalInv     = summaryRows.reduce(function(a,r){ return a+(parseFloat(r.EDW_INVOICE_COUNT)||0); }, 0);
      var sepRows      = summaryRows.filter(function(r){ return monthOf(r.REVIEW_DATE)===9; });
      if (sepRows.length) {
        var sr = sepRows.reduce(function(a,r){ return a+(parseFloat(r.REVIEW_RATE)||0); }, 0) / sepRows.length;
        PD_STORE.sep.revPct = sr * 100;
      }
      PD_STORE.ytd.rev = totalReviews;
      PD_STORE.ytd.inv = totalInv;
    }

    // Update D_ILA monthly array from live quality rows
    if (qualRows) {
      ['jan','feb','mar','apr','may','jun','jul','aug','sep'].forEach(function(pKey, i) {
        var qd = aggregateQualityRows(qualRows, pKey);
        if (qd && qd.ila != null) D_ILA[i] = parseFloat(qd.ila.toFixed(2));
      });
    }

    console.info('[CW Bridge] Live data applied successfully.');
    buildCharts();
    buildCombinedAccuracyChart();
    update();

  } catch(e) {
    console.error('[CW Bridge] applyCWLiveData error:', e);
    // Keep sample data — dashboard still works
  }
}

// ── Web Component definition ─────────────────────────────────────────────────
class ICQualityDashboard extends HTMLElement {

  connectedCallback() {
    // Inject dashboard HTML
    this.innerHTML = WIDGET_TMPL;

    // Initialize after a tick to ensure DOM is settled
    var self = this;
    setTimeout(function() {
      buildCharts();
      buildSiteScorecard('sep');
      update();
      buildCombinedAccuracyChart();
    }, 80);
  }

  // Called by SAC when data bindings are updated
  onCustomWidgetAfterUpdate(changedProperties) {
    if (changedProperties && changedProperties.dataBindings) {
      applyCWLiveData(this);
    }
  }

  // Called by SAC when widget is removed from canvas
  onCustomWidgetDestroy() {
    // Destroy Chart.js instances to avoid memory leaks
    Object.keys(CH).forEach(function(k) {
      if (CH[k] && typeof CH[k].destroy === 'function') CH[k].destroy();
    });
  }
}

customElements.define('ic-quality-dashboard', ICQualityDashboard);
